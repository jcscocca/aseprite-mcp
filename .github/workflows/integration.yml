# Runs the full suite — integration layer included — against a real Aseprite.
#
# Building Aseprite with its GUI needs Skia and is too slow/fragile for CI, so
# this job builds the CLI-only variant (LAF_BACKEND=none, no Skia — the same
# ubuntu/cli/lua combination Aseprite's own CI exercises), pins it to
# $ASEPRITE_REF, and caches the resulting binary. Cache hits run the suite in a
# couple of minutes; misses rebuild (~20 min).
#
# Pushes to main restore and reseed the cached binary, so they normally run in
# a couple of minutes. After a quiet week GitHub's 7-day eviction drops the
# cache and the next run rebuilds it once.
name: integration

on:
  workflow_dispatch:
  push:
    branches: [main]

env:
  ASEPRITE_REF: v1.3.17

jobs:
  integration:
    runs-on: [self-hosted, Linux, thinkpad]
    defaults:
      run:
        working-directory: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
    steps:
      - uses: actions/checkout@v4
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}
          clean: true
      # Each registration has its own _work root; each job checks out a fresh subdirectory.
      # GitHub Runner cleans RUNNER_TEMP and terminates processes carrying this job's tracking ID.
      - name: Isolate Linux job environment
        if: runner.os == 'Linux'
        shell: bash
        run: |
          # Chromium Unix sockets require a short path, even when _work is deeply nested.
          job_tmp=$(mktemp -d /tmp/gha.XXXXXX)
          echo "CI_JOB_TEMP=$job_tmp" >> "$GITHUB_ENV"
          mkdir -p "$job_tmp" "$HOME/.cache"
          printf 'TMPDIR=%s\nTMP=%s\nTEMP=%s\n' "$job_tmp" "$job_tmp" "$job_tmp" >> "$GITHUB_ENV"
          # Do not accidentally invoke Windows executables through WSL interop.
          linux_path=$(printf '%s' "$PATH" | tr ':' '\n' | sed '/^\/mnt\/[a-zA-Z]\//d' | paste -sd:)
          echo "PATH=$linux_path" >> "$GITHUB_ENV"
      - name: Restore cached Aseprite
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/aseprite-bin
          key: aseprite-cli-${{ env.ASEPRITE_REF }}-${{ runner.os }}
      # runtime libs are needed on cache hits too; the -dev packages pull them in
      - name: Check preinstalled build dependencies
        run: |
          cmake --version
          ninja --version
          pkg-config --exists pixman-1 freetype2 harfbuzz x11 xcursor xi xrandr gl fontconfig
      - name: Build Aseprite (CLI-only, no Skia)
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          git clone --branch "$ASEPRITE_REF" --depth 1 \
            --recurse-submodules --shallow-submodules \
            https://github.com/aseprite/aseprite.git aseprite-src
          cmake -S aseprite-src -B aseprite-src/build -G Ninja \
            -DCMAKE_BUILD_TYPE=Debug \
            -DLAF_BACKEND=none \
            -DENABLE_SCRIPTING=ON
          cmake --build aseprite-src/build
          cp -rL aseprite-src/build/bin aseprite-bin
          rm -rf aseprite-src
      # save immediately so a test failure doesn't throw away the build
      - name: Save Aseprite cache
        if: steps.cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v4
        with:
          path: work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/aseprite-bin
          key: aseprite-cli-${{ env.ASEPRITE_REF }}-${{ runner.os }}
      # fail here rather than letting the integration tests silently skip
      - name: Verify the binary runs
        run: ./aseprite-bin/aseprite --version
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Isolate Python dependencies and temporary files
        shell: python {0}
        run: |
          import os, pathlib, tempfile, venv
          root = pathlib.Path(tempfile.mkdtemp(prefix="ci-python-", dir=os.environ["RUNNER_TEMP"]))
          venv.create(root / "venv", with_pip=True)
          (root / "tmp").mkdir()
          with open(os.environ["GITHUB_PATH"], "a") as output:
              print(root / "venv" / ("Scripts" if os.name == "nt" else "bin"), file=output)
          with open(os.environ["GITHUB_ENV"], "a") as output:
              print("VIRTUAL_ENV=" + str(root / "venv"), file=output)
              print("PYTHONNOUSERSITE=1", file=output)
              for key in ("TMPDIR", "TMP", "TEMP"):
                  print(key + "=" + os.environ.get("CI_JOB_TEMP", str(root / "tmp")), file=output)
      - run: pip install -e ".[dev]"
      - name: Run the full suite
        env:
          ASEPRITE_BIN: ${{ github.workspace }}/work/${{ github.run_id }}-${{ github.run_attempt }}-${{ github.job }}-${{ strategy.job-index || 0 }}/aseprite-bin/aseprite
        run: pytest -q tests
      - name: Remove this job's Linux temporary directory
        if: always() && runner.os == 'Linux'
        shell: bash
        working-directory: ${{ github.workspace }}
        run: |
          case "${CI_JOB_TEMP:-}" in
            /tmp/gha.*) rm -rf -- "$CI_JOB_TEMP" ;;
            '') ;;
            *) echo "Unexpected temporary directory; refusing cleanup" >&2; exit 1 ;;
          esac
